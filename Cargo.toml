[workspace]
resolver = "3"
members = ["crates/brnch-core", "crates/brnch-gitd",
    "crates/brnch-agents", "crates/brnch-events", "crates/brnch-process"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Dooservice"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Every fallible function returns the single BrnchError type, documented in error.rs.
missing_errors_doc = "allow"
