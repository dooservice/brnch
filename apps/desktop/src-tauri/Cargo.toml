[package]
name = "brnch-desktop"
description = "The brnch window: a thin Tauri shell over the Rust crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
brnch-agents = { version = "0.1.0", path = "../../../crates/brnch-agents" }
brnch-core = { version = "0.1.0", path = "../../../crates/brnch-core" }
brnch-gitd = { version = "0.1.0", path = "../../../crates/brnch-gitd" }
brnch-process = { version = "0.1.0", path = "../../../crates/brnch-process" }
brnch-sandbox = { version = "0.1.0", path = "../../../crates/brnch-sandbox" }
brnch-store = { version = "0.1.0", path = "../../../crates/brnch-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
