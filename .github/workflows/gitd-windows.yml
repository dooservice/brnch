# Runs brnch's gitd tests on Windows against a real gitd, the way the app connects to it.
name: gitd on Windows

on:
  workflow_dispatch:
  push:
    branches: [gitd-windows]

permissions:
  contents: read

jobs:
  gitd-windows:
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup update stable
      - name: Start gitd in a terminal, as its Windows guide describes, and connect from Rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\gitd-test | Out-Null
          Invoke-WebRequest -OutFile C:\gitd-test\gitd.exe https://github.com/dooservice/gitd/releases/download/0.15.1/gitd-windows-amd64.exe
          @'
          socket = "C:/gitd-test/gitd.sock"
          state = "C:/gitd-test/state"
          roots = ["C:/gitd-test/workspaces"]
          '@ | Set-Content -Encoding utf8 C:\gitd-test\gitd.toml
          $gitd = Start-Process -FilePath C:\gitd-test\gitd.exe -ArgumentList 'serve','--config','C:\gitd-test\gitd.toml' -RedirectStandardOutput C:\gitd-test\out.log -RedirectStandardError C:\gitd-test\err.log -WindowStyle Hidden -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path C:\gitd-test\gitd.sock); $i++) { Start-Sleep -Seconds 1 }
          $env:GITD_SOCKET = 'C:\gitd-test\gitd.sock'
          $env:GITD_TEST_ROOT = 'C:/gitd-test/workspaces'
          & C:\gitd-test\gitd.exe info
          try {
            cargo test -p brnch-gitd --test gitd_workspace_provider_tests -- --ignored --nocapture
            $code = $LASTEXITCODE
            "---- gitd, probed from other clients"
            $socket = New-Object System.Net.Sockets.Socket([System.Net.Sockets.AddressFamily]::Unix, [System.Net.Sockets.SocketType]::Stream, [System.Net.Sockets.ProtocolType]::Unspecified)
            try { $socket.Connect((New-Object System.Net.Sockets.UnixDomainSocketEndPoint('C:\gitd-test\gitd.sock'))); "dotnet: connected" } catch { "dotnet: $($_.Exception.Message)" }
          } finally {
            "---- what gitd logged"
            Get-Content C:\gitd-test\out.log, C:\gitd-test\err.log -ErrorAction SilentlyContinue
            Stop-Process -Id $gitd.Id -Force -ErrorAction SilentlyContinue
          }
          exit $code
