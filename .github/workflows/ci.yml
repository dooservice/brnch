name: CI

# Builds and tests brnch on Linux and on Windows, runs the Windows isolation test on a real
# Windows machine, and leaves the Windows installer as a downloadable artifact.
on:
  push:
    branches: [main, ci-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup update stable && rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm
      - working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm run check

  windows:
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup update stable
      - name: Fetch the gitd that ships inside the installer, checked against its published checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          $release = 'https://github.com/dooservice/gitd/releases/download/0.15.1/gitd-windows-amd64.exe'
          $target = 'apps/desktop/src-tauri/resources/gitd.exe'
          Invoke-WebRequest -OutFile $target $release
          $expected = (curl.exe -sL "$release.sha256").Trim().Split()[0].ToLower()
          $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "gitd checksum mismatch: $actual, expected $expected" }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm
      - name: Build the interface the window shows
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Test every crate and the window's Rust side
        run: cargo test --workspace
      - name: Start the shipped gitd as the person, the way the app does
        env:
          BRNCH_TEST_GITD_PROGRAM: ${{ github.workspace }}\apps\desktop\src-tauri\resources\gitd.exe
        run: cargo test -p brnch-desktop --test gitd_supervisor_tests -- --ignored --nocapture
      - name: Run an agent in the dedicated account, as brnch does
        run: cargo test -p brnch-sandbox --test windows_isolation_tests -- --ignored --nocapture
      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm tauri build
      - name: The installer carries gitd
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/D=C:\brnch-installed' -Wait
          $found = Get-ChildItem C:\brnch-installed -Recurse -Filter gitd.exe
          $found | Select-Object FullName
          if (-not $found) { throw 'the installed application has no gitd' }
      - uses: actions/upload-artifact@v4
        with:
          name: brnch-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  acp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: rustup update stable && rustc --version
      - name: The ACP client talks to the real Claude Code adapter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cargo test -p brnch-acp --test claude_adapter_tests -- --ignored --nocapture
